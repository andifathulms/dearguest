proxy_pass http://backend:8000;
proxy_set_header Host $host;
# Django reads the client IP from X-Real-IP (TRUST_PROXY_HEADERS). X-Forwarded-For
# is overwritten, not appended to, so nothing client-supplied reaches Django.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# SECURE_PROXY_SSL_HEADER: tells Django the request came in over HTTPS (no redirect loop).
proxy_set_header X-Forwarded-Proto $scheme;
