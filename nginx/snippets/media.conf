# User uploads. Upload validation (apps/invitations/uploads.py) already limits
# them to images and audio with content-derived extensions; these headers are
# the second line of defence if anything else ever lands in /media/.
location /media/ {
    alias /app/media/;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox" always;
    add_header Content-Disposition $media_disposition always;
}
