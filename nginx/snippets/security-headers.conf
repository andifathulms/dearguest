# Security headers for pages nginx serves itself (the SPA shell, prerendered
# marketing pages, built assets). Django sets its own on proxied responses.
# Included per location: a location with any add_header of its own drops the
# server-level ones, so each such location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Nothing on the site uses these. Phase 3: open `payment` for the provider.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Strict-Transport-Security $hsts always;
# CSP: CSP_MODE=enforce sends Content-Security-Policy; anything else sends the
# same policy as Report-Only (violations go to /api/csp-report/).
add_header Content-Security-Policy $csp_enforce always;
add_header Content-Security-Policy-Report-Only $csp_report_only always;
