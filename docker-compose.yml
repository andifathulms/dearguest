version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: undangan_db
      POSTGRES_USER: undangan_user
      POSTGRES_PASSWORD: undangan_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan_user -d undangan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./media:/app/media
    ports:
      - "8010:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5183:5173"
    environment:
      # Same-origin through the Vite proxy, so the httpOnly session cookies apply.
      - VITE_API_URL=/api
      - VITE_ADMIN_WHATSAPP_NUMBER=${ADMIN_WHATSAPP_NUMBER:-628123456789}
      - DEV_PROXY_TARGET=http://backend:8000
      # Dev only: list hidden (legacy) themes in pickers and /tema. Ignored in builds.
      - VITE_SHOW_HIDDEN_THEMES=1

volumes:
  postgres_data:
