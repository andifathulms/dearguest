# LOCAL prod-like stack only (docker-compose.local-prod.yml mounts it): the
# load generator is one machine, so it names each simulated guest's address
# in X-Loadtest-IP and nginx uses that as the client address. Per-IP rate
# limits then behave as with real guests. Never on a server.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Loadtest-IP;
