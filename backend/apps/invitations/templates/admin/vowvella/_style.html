<style>
/* Backoffice pages (backoffice.py). Colours come from the admin's own variables, so dark mode follows. */
.ops-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 20px; }
.ops-nav a { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--hairline-color); color: var(--body-fg); font-weight: 500; }
.ops-nav a.on { background: var(--selected-bg); border-color: var(--border-color); font-weight: 700; }
.dashboard #content { width: auto; max-width: 1400px; }   /* the admin pins its index to 600px */
.ops-apps { max-width: 640px; }
.ops-kpis { display: flex; flex-wrap: wrap; gap: 1px; background: var(--hairline-color);
  border: 1px solid var(--hairline-color); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.ops-kpi { flex: 1 1 150px; box-sizing: border-box; background: var(--body-bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--body-fg); }
a.ops-kpi:hover { background: var(--darkened-bg); }
.ops-kpi.act { box-shadow: inset 4px 0 0 #d99a1e; }
.ops-kpi .k { font-size: 12px; color: var(--body-quiet-color); }
.ops-kpi .v { font-size: 26px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
.ops-kpi .d { font-size: 12px; color: var(--body-quiet-color); font-variant-numeric: tabular-nums; }
.ops-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; margin-bottom: 24px; }
.ops-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 900px) { .ops-cols { grid-template-columns: minmax(0, 1fr); } }
.ops-panel { border: 1px solid var(--hairline-color); border-radius: 8px; min-width: 0; }
.ops-panel > h2 { margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--hairline-color);
  display: flex; justify-content: space-between; gap: 8px; background: var(--darkened-bg); color: var(--body-fg); }
.ops-panel > h2 small, .ops-panel > h2 a { font-weight: 400; font-size: 12px; }
.ops-panel table { width: 100%; border: 0; }
.ops-panel td, .ops-panel th { vertical-align: top; }
.ops-slug { white-space: nowrap; }
.ops-wide { overflow-x: auto; margin-bottom: 20px; }
.ops-wide table { min-width: 760px; }
.ops-empty { padding: 14px; color: var(--body-quiet-color); margin: 0; }
.ops-time { white-space: nowrap; color: var(--body-quiet-color); font-variant-numeric: tabular-nums; }
.ops-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--body-fg); background: var(--darkened-bg); border: 1px solid var(--hairline-color); margin: 1px 2px 1px 0; }
.ops-pill.ok { background: var(--message-success-bg); }
.ops-pill.warn { background: var(--message-warning-bg); }
.ops-pill.crit { background: var(--message-error-bg); }
.ops-pill.brand { background: var(--selected-bg); }
.ops-funnel { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ops-step { display: grid; grid-template-columns: 110px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
.ops-bar { height: 10px; background: var(--darkened-bg); border-radius: 3px; overflow: hidden; }
.ops-bar i { display: block; height: 100%; background: var(--secondary); border-radius: 3px; }
.ops-step .n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ops-pills { padding: 12px 14px; }
.ops-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.ops-num { text-align: right; font-variant-numeric: tabular-nums; }
.ops-help { color: var(--body-quiet-color); margin: 8px 0 20px; max-width: 70ch; }
</style>
